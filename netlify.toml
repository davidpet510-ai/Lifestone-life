# Static site (no build step) with serverless functions.
[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Task reminders go out by email/text a few minutes before each task is due.
[functions."task-reminders"]
  schedule = "*/15 * * * *"

# The online application was retired: every quote now goes to a licensed agent.
[[redirects]]
  from = "/apply.html"
  to = "/agent-callback.html"
  status = 301
  force = true

[[redirects]]
  from = "/apply"
  to = "/agent-callback.html"
  status = 301
  force = true

# Keep server code, database setup and scripts from being served as web pages.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The CRM dashboard: never indexed, never framed, only talks to this site and Supabase.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-cache"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
