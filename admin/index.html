<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0F2419">
<title>Lifestone CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<header class="ad-top" id="ad-top" hidden>
  <div class="ad-top-in">
    <a href="#/home" class="ad-brand" aria-label="Lifestone CRM home">
      <img src="/images/logo.png" width="40" height="37" alt="">
      <span><b>Lifestone</b><small>CRM</small></span>
    </a>
    <nav class="ad-nav" aria-label="Main">
      <a href="#/home" data-nav="home">Dashboard</a>
      <a href="#/leads" data-nav="leads">Leads</a>
      <a href="#/tasks" data-nav="tasks">Tasks <i class="nav-badge" id="nav-tasks" hidden></i></a>
      <a href="#/policies" data-nav="policies">Policies</a>
      <a href="#/reports" data-nav="reports">Reports</a>
      <a href="#/archive" data-nav="archive">Archive</a>
      <a href="#/team" data-nav="team" data-admin hidden>Team</a>
      <a href="#/settings" data-nav="settings">Settings</a>
    </nav>
    <div class="gs" id="gs">
      <label class="sr" for="gs-input">Search everything</label>
      <input type="search" id="gs-input" placeholder="Search leads, policies, tasks, notes…" autocomplete="off"
             role="combobox" aria-expanded="false" aria-controls="gs-results" aria-autocomplete="list">
      <kbd class="gs-key" aria-hidden="true">/</kbd>
      <div class="gs-results" id="gs-results" role="listbox" hidden></div>
    </div>
    <div class="ad-me">
      <span id="ad-me-name"></span>
      <button type="button" class="ad-link-btn" id="ad-signout">Sign out</button>
    </div>
  </div>
</header>

<main id="ad-main" class="ad-main" tabindex="-1">
  <div class="ad-loading" role="status">Loading…</div>
</main>

<div class="ad-toast" id="ad-toast" role="status" aria-live="polite" hidden></div>

<script src="/admin/vendor/supabase-2.45.4.js"></script>
<script src="/config/lead-statuses.js"></script>
<script src="/admin/app.js"></script>
</body>
</html>
